<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="884" viewBox="0 0 1200 884" role="img" aria-labelledby="title desc"><title id="title">Veylo repository layout</title><desc id="desc">Frontend contains the page, styling, client logic, branding and fonts. Backend contains Flask, dependency versions and the required model binary. Documentation, test photos and research files accompany the app. Uploads and scan history are generated locally and excluded from Git.</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#edf6ed}.title{font-size:29px;font-weight:650;letter-spacing:-.8px}.sub{font-size:15px;fill:#a6beb0}.eyebrow{font-size:12px;font-weight:650;letter-spacing:2px;fill:#71d6a5}.node-title{font-size:21px;font-weight:650;letter-spacing:-.5px}.body{font-size:15px;fill:#c1d3c6}.code{font-size:14px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#c3ddcb}.small{font-size:12px;fill:#a6beb0}.tag{font-size:11px;letter-spacing:1.3px;fill:#8ee5b5;font-weight:650}.wire{fill:none;stroke:#6dba8f;stroke-width:1.6}.muted-wire{fill:none;stroke:#4b6b59;stroke-width:1.4;stroke-dasharray:5 5}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#6dba8f" stroke-width="1.3"/></marker></defs><rect x="1" y="1" width="1198" height="882" rx="24" fill="#10241c" stroke="#34503f"/><text x="44" y="40" class="eyebrow" >PROJECT / 02</text><text x="44" y="82" class="title" >A small app, with its model included.</text><text x="44" y="112" class="sub" >The application, research and supporting files live together in one repository.</text><rect x="44" y="148" width="1112" height="70" rx="14" fill="#244a37" stroke="#5c9b75"/><text x="70" y="180" class="node-title" >Veylo-AI-Project/</text><text x="1130" y="190" class="tag" text-anchor="end">REPOSITORY ROOT</text><path d="M600 218 V242 H218 V266 M600 242 V266 M600 242 H982 V266" class="wire"/><rect x="44" y="266" width="348" height="384" rx="16" fill="#183429" stroke="#3c5d49"/><text x="66" y="299" class="tag" >CLIENT</text><text x="66" y="334" class="node-title" >frontend/</text><rect x="426" y="266" width="348" height="384" rx="16" fill="#183429" stroke="#3c5d49"/><text x="448" y="299" class="tag" >LOCAL INFERENCE</text><text x="448" y="334" class="node-title" >backend/</text><rect x="808" y="266" width="348" height="384" rx="16" fill="#183429" stroke="#3c5d49"/><text x="830" y="299" class="tag" >DOCS / DEMO / RESEARCH</text><text x="830" y="334" class="node-title" >Supporting files</text><text x="66" y="374" class="code" >index.html</text><text x="66" y="410" class="code" >static/brand/</text><text x="66" y="450" class="code" >static/css/style.css</text><text x="66" y="490" class="code" >static/js/app.js</text><text x="66" y="530" class="code" >static/fonts/</text><text x="66" y="395" class="small" >Single-page interface</text><text x="66" y="435" class="small" >SVG logo and favicon</text><text x="66" y="475" class="small" >Theme and visual system</text><text x="66" y="515" class="small" >Upload, results and history</text><text x="66" y="555" class="small" >Self-hosted fonts + licenses</text><text x="66" y="610" class="body" >No npm build is required.</text><text x="448" y="374" class="code" >app.py</text><text x="448" y="426" class="code" >requirements.txt</text><text x="448" y="478" class="code" >models/</text><text x="448" y="396" class="small" >Flask routes and model execution</text><text x="448" y="448" class="small" >Pinned runtime dependencies</text><text x="448" y="501" class="code" >MobileNetV2_best_model.keras</text><text x="448" y="526" class="small" >Required binary / approximately 11.6 MB</text><text x="448" y="610" class="body" >No training or API key is required.</text><text x="830" y="374" class="code" >README.md</text><text x="830" y="410" class="code" >requirements.txt</text><text x="830" y="446" class="code" >brag.mp4</text><text x="830" y="482" class="code" >docs/</text><text x="830" y="518" class="code" >Test Samples/</text><text x="830" y="554" class="code" >Food-Freshness AI Model/</text><text x="830" y="610" class="small" >Notebooks and evaluation outputs</text><rect x="44" y="686" width="1112" height="150" rx="16" fill="#14271f" stroke="#67816d" stroke-dasharray="6 5"/><text x="68" y="720" class="tag" >GENERATED LOCALLY / EXCLUDED FROM GIT</text><text x="68" y="757" class="code" >backend/history.json</text><text x="622" y="757" class="code" >frontend/static/uploads/</text><text x="68" y="790" class="body" >Created as scans are saved. A new checkout starts with an empty history.</text><text x="68" y="817" class="small" >Datasets, alternate model weights, assistant tools and video-production caches remain outside the upload.</text></svg>