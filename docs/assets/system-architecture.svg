<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">Veylo system architecture and data pipeline</title><desc id="desc">Browser uploads a food photo to Flask. Pillow converts RGB pixels to 128 by 128 and normalizes them; Keras with NumPy and JAX runs the bundled MobileNetV2 weights. Flask returns the five-class prediction as JSON and stores the upload and history locally. History can be retrieved or deleted.</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#edf6ed}.title{font-size:29px;font-weight:650;letter-spacing:-.8px}.sub{font-size:15px;fill:#a6beb0}.eyebrow{font-size:12px;font-weight:650;letter-spacing:2px;fill:#71d6a5}.node-title{font-size:21px;font-weight:650;letter-spacing:-.5px}.body{font-size:15px;fill:#c1d3c6}.code{font-size:14px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#c3ddcb}.small{font-size:12px;fill:#a6beb0}.tag{font-size:11px;letter-spacing:1.3px;fill:#8ee5b5;font-weight:650}.wire{fill:none;stroke:#6dba8f;stroke-width:1.6}.muted-wire{fill:none;stroke:#4b6b59;stroke-width:1.4;stroke-dasharray:5 5}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#6dba8f" stroke-width="1.3"/></marker></defs><rect x="1" y="1" width="1198" height="738" rx="24" fill="#10241c" stroke="#34503f"/><text x="44" y="40" class="eyebrow" >SYSTEM / 01</text><text x="44" y="82" class="title" >One image. A local inference pipeline.</text><text x="44" y="112" class="sub" >Browser to model to readable results, with no external inference API.</text><rect x="44" y="164" width="292" height="180" rx="16" fill="#183429" stroke="#3c5d49"/><text x="66" y="194" class="tag" >01 / WEB CLIENT</text><text x="66" y="227" class="node-title" >Upload &amp; results</text><text x="66" y="260" class="body" >HTML, CSS and JavaScript</text><text x="66" y="284" class="body" >Choose or drop a food image</text><text x="66" y="308" class="body" >Render class, confidence, scores</text><rect x="454" y="164" width="292" height="180" rx="16" fill="#183429" stroke="#3c5d49"/><text x="476" y="194" class="tag" >02 / FLASK API</text><text x="476" y="227" class="node-title" >Request controller</text><text x="476" y="260" class="body" >Validate supported file type</text><text x="476" y="284" class="body" >Assign a unique upload name</text><text x="476" y="308" class="body" >Coordinate inference and history</text><rect x="864" y="164" width="292" height="180" rx="16" fill="#183429" stroke="#3c5d49"/><text x="886" y="194" class="tag" >03 / INFERENCE</text><text x="886" y="227" class="node-title" >Pillow + Keras</text><text x="886" y="260" class="body" >RGB / 128 × 128 / float32 [0, 1]</text><text x="886" y="284" class="body" >MobileNetV2 / NumPy + JAX</text><text x="886" y="308" class="body" >Five freshness probabilities</text><path d="M336 207 H454" class="wire" marker-end="url(#arrow)"/><text x="395" y="191" class="small" text-anchor="middle">POST /predict</text><path d="M454 296 H336" class="wire" marker-end="url(#arrow)"/><text x="395" y="280" class="small" text-anchor="middle">Prediction JSON</text><path d="M746 207 H864" class="wire" marker-end="url(#arrow)"/><text x="805" y="191" class="small" text-anchor="middle">RGB image</text><path d="M864 296 H746" class="wire" marker-end="url(#arrow)"/><text x="805" y="280" class="small" text-anchor="middle">Class scores</text><path d="M600 344 V410 H210 V466" class="wire" marker-end="url(#arrow)"/><path d="M600 410 V466" class="wire" marker-end="url(#arrow)"/><path d="M1010 466 V344" class="muted-wire" marker-end="url(#arrow)"/><text x="44" y="445" class="eyebrow" >LOCAL FILES</text><rect x="44" y="466" width="332" height="167" rx="16" fill="#183429" stroke="#3c5d49"/><text x="66" y="496" class="tag" >PERSISTENCE</text><text x="66" y="529" class="node-title" >Scan history</text><text x="66" y="562" class="body" >backend/history.json</text><text x="66" y="586" class="body" >Created on the first scan</text><text x="66" y="610" class="body" >Atomic save; individual or bulk delete</text><rect x="434" y="466" width="332" height="167" rx="16" fill="#183429" stroke="#3c5d49"/><text x="456" y="496" class="tag" >UPLOAD STORAGE</text><text x="456" y="529" class="node-title" >Image files</text><text x="456" y="562" class="body" >frontend/static/uploads/</text><text x="456" y="586" class="body" >UUID-based image filenames</text><text x="456" y="610" class="body" >Served with each history record</text><rect x="824" y="466" width="332" height="167" rx="16" fill="#183429" stroke="#3c5d49"/><text x="846" y="496" class="tag" >BUNDLED MODEL</text><text x="846" y="529" class="node-title" >Production weights</text><text x="846" y="562" class="body" >backend/models/</text><text x="846" y="586" class="body" >MobileNetV2_best_model.keras</text><text x="846" y="610" class="body" >Included in the repository</text><text x="44" y="677" class="code" >GET /history  ·  DELETE /history/{id}  ·  DELETE /history</text><text x="44" y="708" class="small" >The decorative background video streams to the browser separately; image analysis runs on the local machine.</text></svg>